services:
  search:
    build:
      context: ./backend
      dockerfile: mcp_servers/search.Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"

  postgres:
    # pgvector/pgvector:pg16 is postgres:16 plus the pgvector extension,
    # needed for the LTM store's semantic search (backend/ltm).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data

volumes:
  cortex_pgdata:
